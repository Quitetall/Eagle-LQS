[package]
name = "eagle-lqs-bench-rs"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "bench_rs"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "abort"

[dependencies]
lamquant-firmware = { git = "https://github.com/Quitetall/LamQuant-Firmware.git", rev = "ebd5488653c0040a511b2aa89635c39e76006d70", default-features = false }

# Standalone host workspace — do NOT inherit the embedded target.
[workspace]
