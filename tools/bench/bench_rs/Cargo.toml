[package]
name = "bench_rs"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "bench_rs"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "abort"

[dependencies]
lamquant-firmware = { git = "https://github.com/Quitetall/LamQuant-Firmware.git", rev = "8608b06175e454b2d0b65d4b7f53f37833ca5ec4", default-features = false }

# Standalone host workspace — do NOT inherit the embedded target.
[workspace]
