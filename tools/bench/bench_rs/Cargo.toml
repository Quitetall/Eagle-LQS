[package]
name = "bench_rs"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "bench_rs"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "abort"

[dependencies]
lamquant-firmware = { git = "https://github.com/Quitetall/LamQuant-Firmware.git", rev = "baa3348d1747c33e7f66f969e7bae12c1c06b2d7", default-features = false }

# Standalone host workspace — do NOT inherit the embedded target.
[workspace]
