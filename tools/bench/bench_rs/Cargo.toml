[package]
name = "eagle-lqs-bench-rs"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "bench_rs"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "abort"

[dependencies]
lamquant-firmware = { git = "https://github.com/Quitetall/LamQuant-Firmware.git", rev = "848411464ea49cc9d38a4c4e59a4ee66171b3644", default-features = false }

# Standalone host workspace — do NOT inherit the embedded target.
[workspace]
