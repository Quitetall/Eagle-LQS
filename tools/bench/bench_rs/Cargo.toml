[package]
name = "eagle-lqs-bench-rs"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "bench_rs"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "abort"

[dependencies]
lamquant-firmware = { git = "https://github.com/Quitetall/LamQuant-Firmware.git", rev = "4832a4654f913dcf2d065e82deac7174e0cfd81a", default-features = false }

# Standalone host workspace — do NOT inherit the embedded target.
[workspace]
