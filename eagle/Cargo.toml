[package]
name = "eagle"
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Eagle — LamQuant's validation suite. LQS compliance, benchmarks, clinical tasks."
repository = "https://github.com/Quitetall/Eagle"

[lib]
name = "eagle"
path = "src/lib.rs"

[[bin]]
name = "eagle"
path = "src/bin/eagle.rs"

[dependencies]
# OpenECS — vendor-neutral EEG codec grading standard.
# Exact owner revision required by ADR 0092 A17 source convergence.
open-eeg-codec-standard = { git = "https://github.com/Quitetall/OpenECS.git", rev = "8435094e4142bb8ad3e32c9814bf86aa33daef76" }
