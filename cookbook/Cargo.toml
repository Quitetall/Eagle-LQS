[package]
name = "blut-cookbook-eagle"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Eagle — LamQuant's testing/validation/benchmarking BLUT cookbook"
license = "GPL-3.0-or-later"

[lib]
name = "blut_cookbook_eagle"
path = "src/lib.rs"

[[bin]]
name = "blut-eagle"
path = "src/main.rs"

[dependencies]
blut = { git = "https://github.com/Quitetall/blut.git", rev = "9b75234e443f72cff3af101bf3dfcdc29f4e7c07", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
async-trait = "0.1"
anyhow = "1"

[workspace]
